<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shortcut Game</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="game.js"></script>
</head>
<body>

<div class="game-container">
  <div id="start-screen" class="screen active">
    <h1>Shortcut Game</h1>
    <p>Nauč se různé klávesové zkratky a získej body!</p>
    <button class="btn btn-mode" onclick="startGame('quiz')">Mod 1: Quiz</button>
    <button class="btn btn-mode" onclick="startGame('interactive')">Mod 2: Interaktivní</button>
  </div>

  <!-- GAMEPLAY SCREEN -->
  <div id="game-screen" class="screen">
    <div class="game-header">
      <div id="mode-label">Mod: Quiz</div>
      <div id="progress-label">Otázka: 1/10</div>
      <div id="score-label">Body: 0</div>
    </div>
    
    <h2 id="question-prompt">Match the prompt below:</h2>
    
    <!-- Area for showing keys or text based on question format -->
    <div id="question-render-area"></div>

    <!-- Mode 1 Container -->
    <div id="quiz-options-container" class="choices-grid"></div>

    <!-- Mode 2 Container -->
    <div id="interactive-container" style="display: none;">
      <div id="live-input-zone" class="input-zone">Zmáčkni klávesové zkratky podle popisu!</div>
    </div>

    <div id="feedback-msg" class="feedback"></div>
    <button id="next-btn" class="btn next-btn" style="display: none;" onclick="nextQuestion()">Další ➡️</button>
    <button class="btn quit-btn" onclick="quitToMenu()">Opustit</button>
  </div>

  <!-- END SCREEN -->
  <div id="result-screen" class="screen">
    <h1>🏆 Dokázal jsi to!</h1>
    <p id="final-stats">Získal jsi 0 bodů!</p>
    <button class="btn" onclick="quitToMenu()">Hrát znovu</button>
  </div>
</div>

</body>
</html>
